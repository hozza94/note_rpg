<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basileia - The Age of Gray</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-gray">
    <div id="app" class="glass-container">
        <!-- Header: World Saturation Status -->
        <header class="app-header">
            <h1 class="world-title">Basileia</h1>
            <div class="saturation-meter">
                <span class="label">세계의 색채</span>
                <div class="meter-bar">
                    <div id="saturation-fill" class="fill" style="width: 0%;"></div>
                </div>
                <span id="saturation-value" class="value">0%</span>
            </div>
        </header>

        <main class="game-layout">
            <!-- Left: Character Info -->
            <aside class="character-pane card">
                <div class="char-header" style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                        <h2 id="char-name">순례자</h2>
                        <span id="char-title" class="badge">Pilgrim</span>
                    </div>
                    <button id="btn-settings" class="action-btn small secondary" style="padding: 5px 10px; font-size: 0.9rem;">⚙️ 설정</button>
                </div>
                
                <!-- Quest/Progress Section -->
                <div class="quest-section">
                    <div class="quest-header">
                        <h3 id="quest-title">비손 유역 탐사</h3>
                        <button id="btn-boss-challenge" class="action-btn danger small">👑 보스 도전</button>
                    </div>
                    <div class="bar-container"><div id="quest-bar" class="bar quest" style="width: 0%;"></div></div>
                    <span id="quest-text" class="quest-progress">0%</span>
                </div>

                <div class="stats-group">
                    <div class="stat-item">
                        <label>체력 (HP)</label>
                        <div class="bar-container"><div id="hp-bar" class="bar hp" style="width: 100%;"></div></div>
                        <span id="hp-text">100 / 100</span>
                    </div>
                    <div class="stat-item">
                        <label>기도 (PP)</label>
                        <div class="bar-container"><div id="pp-bar" class="bar pp" style="width: 100%;"></div></div>
                        <span id="pp-text">50 / 50</span>
                    </div>
                    <div class="bonus-points-container">
                        <span class="label">남은 포인트:</span>
                        <span id="bonus-points" class="val">0</span>
                    </div>
                    <div class="stat-grid">
                        <div class="stat-box">
                            <span class="label">공격력</span>
                            <div class="val-group">
                                <span id="atk-value" class="val">10</span>
                                <button class="point-btn hidden" data-stat="atk">+</button>
                            </div>
                        </div>
                        <div class="stat-box">
                            <span class="label">방어력</span>
                            <div class="val-group">
                                <span id="def-value" class="val">5</span>
                                <button class="point-btn hidden" data-stat="def">+</button>
                            </div>
                        </div>
                        <div class="stat-box">
                            <span class="label">신앙심</span>
                            <div class="val-group">
                                <span id="faith-value" class="val">1</span>
                                <button class="point-btn hidden" data-stat="faith">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Center: Game Log & Battle Scene -->
            <section class="log-pane card">
                <!-- Battle Enemy Info (Hidden by default) -->
                <div id="battle-scene" class="battle-scene hidden">
                    <div class="monster-card">
                        <div class="monster-header">
                            <span id="monster-grade" class="grade-badge">F</span>
                            <h3 id="monster-name">회색 슬라임</h3>
                            <span id="monster-level">Lv.1</span>
                        </div>
                        <div class="monster-stats">
                            <div class="bar-container mini">
                                <div id="monster-hp-bar" class="bar hp" style="width: 100%;"></div>
                            </div>
                            <span id="monster-hp-text">150 / 150</span>
                        </div>
                    </div>
                </div>
                
                <div id="game-log" class="log-content">
                    <div class="log-entry system">세상이 회색빛으로 물들었습니다...</div>
                    <div class="log-entry info">당신은 순례의 길을 시작합니다.</div>
                </div>
            </section>

            <!-- Right: Inventory/Skills -->
            <aside class="data-pane card">
                <nav class="tab-nav">
                    <button class="tab-btn active" data-tab="inventory">소지품</button>
                    <button class="tab-btn" data-tab="equipment">장비</button>
                    <button class="tab-btn" data-tab="skills">스킬</button>
                </nav>
                <div class="tab-content">
                    <div id="inventory-list" class="item-list">
                        <!-- Items/Equipment will be injected here -->
                        <div class="empty-msg">데이터가 없습니다.</div>
                    </div>
                </div>
            </aside>
        </main>

        <!-- Footer: Actions -->
        <footer class="action-footer">
            <div id="explore-actions" class="action-buttons">
                <button id="btn-explore" class="action-btn primary">👣 탐험하기</button>
                <button id="btn-worship" class="action-btn secondary">🙏 예배하기</button>
                <button id="btn-rest" class="action-btn">💤 휴식하기</button>
            </div>
            <div id="battle-actions" class="action-buttons hidden">
                <button id="btn-attack" class="action-btn primary">⚔️ 공격</button>
                <button id="btn-skill" class="action-btn secondary">✨ 기술</button>
                <button id="btn-run" class="action-btn">🏃 도망</button>
            </div>
        </footer>
    </div>

    <!-- Modals (Worship, Level Up, etc) -->
    <div id="modal-overlay" class="hidden">
        <div id="modal-content" class="modal card">
            <!-- Modal content injected by JS -->
        </div>
    </div>

    <!-- Verse Card Overlay (Phase 3) -->
    <div id="verse-overlay" class="hidden">
        <div id="verse-card-container">
            <div id="verse-card" class="verse-card">
                <div class="verse-deco top">†</div>
                <p id="verse-content"></p>
                <div class="verse-reference" id="verse-ref"></div>
                <div class="verse-deco bottom">Basileia</div>
            </div>
            <div class="verse-actions">
                <button id="btn-download-verse" class="action-btn">💾 이미지 저장</button>
                <button id="btn-close-verse" class="action-btn secondary">닫기</button>
            </div>
        </div>
    </div>

    <!-- Auth Overlay (Phase 6) -->
    <div id="auth-overlay" class="hidden">
        <div class="auth-card card" style="text-align: center; width: 350px; max-width: 90vw;">
            <h2 style="margin-bottom: 5px;">여정의 시작</h2>
            <p style="color: #aaa; margin-bottom: 20px; font-size: 0.9rem;">당신의 아이디와 비밀번호를 기록하십시오.</p>
            <div class="auth-form" style="display: flex; flex-direction: column; gap: 10px;">
                <input type="text" id="auth-id" placeholder="계정 아이디" autocomplete="off" style="padding: 10px; border-radius: 4px; background: rgba(0,0,0,0.5); color: white; border: 1px solid #444;">
                <input type="password" id="auth-pw" placeholder="비밀번호" style="padding: 10px; border-radius: 4px; background: rgba(0,0,0,0.5); color: white; border: 1px solid #444;">
                <p id="auth-msg" class="auth-msg" style="color: #ff4b2b; font-size: 0.85rem; margin: 5px 0; min-height: 1.2em;"></p>
                <div class="auth-actions" style="display: flex; gap: 10px;">
                    <button id="btn-login" class="action-btn primary" style="flex:1; white-space: nowrap; font-size: 0.95rem;">로그인</button>
                    <button id="btn-register" class="action-btn secondary" style="flex:1; white-space: nowrap; font-size: 0.95rem;">회원가입</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Overlay -->
    <div id="settings-overlay" class="hidden">
        <div class="settings-card card" style="text-align: center; max-width: 320px;">
            <h2 style="margin-bottom: 20px;">⚙️ 설정</h2>
            
            <div style="margin-bottom: 20px; text-align: left;">
                <label style="font-size: 0.9rem; color: #aaa; display: block; margin-bottom: 5px;">닉네임 변경</label>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="settings-nickname" placeholder="새로운 닉네임" autocomplete="off" style="flex: 1; padding: 10px; border-radius: 4px; background: rgba(0,0,0,0.5); color: white; border: 1px solid #444;">
                    <button id="btn-update-nickname" class="action-btn small primary">변경</button>
                </div>
                <p id="settings-msg" style="color: #4caf50; font-size: 0.85rem; margin-top: 5px; min-height: 1.2em;"></p>
            </div>

            <div class="settings-actions" style="display:flex; flex-direction:column; gap:10px;">
                <button id="btn-logout" class="action-btn secondary">로그아웃</button>
                <button id="btn-reset" class="action-btn danger">⚠️ 데이터 초기화 (처음부터)</button>
                <button id="btn-close-settings" class="action-btn" style="margin-top: 10px; background: #333; border-color: #555;">닫기</button>
            </div>
        </div>
    </div>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/data.js"></script>
    <script src="js/inventory.js"></script>
    <script src="game.js"></script>
</body>
</html>
