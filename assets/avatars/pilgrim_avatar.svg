<svg width="440" height="620" viewBox="0 0 440 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171C29"/>
      <stop offset="1" stop-color="#0D1018"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8C97AD"/>
      <stop offset="1" stop-color="#555F74"/>
