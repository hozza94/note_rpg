    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#313B50"/>
      <stop offset="1" stop-color="#1B2230"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 310) rotate(90) scale(280 190)">
      <stop stop-color="#8FA3CC" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8FA3CC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="10" y="10" width="420" height="600" rx="20" fill="url(#panelBg)" stroke="#414D66" stroke-width="2"/>
  <ellipse cx="220" cy="310" rx="190" ry="280" fill="url(#vignette)"/>

